name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings (non-blocking)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/npm-audit.json";
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch {
            console.log("NPM_AUDIT_REPORT_UNAVAILABLE");
            process.exit(0);
          }
          const severityRank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 };
          console.log("NPM_AUDIT_SUMMARY=" + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          const rows = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via ?? []).filter((entry) => typeof entry !== "string").map((entry) => ({
              title: entry.title,
              url: entry.url,
              range: entry.range
            }))
          })).sort((a, b) =>
            (severityRank[b.severity] ?? 0) - (severityRank[a.severity] ?? 0) ||
            Number(b.isDirect) - Number(a.isDirect) ||
            a.name.localeCompare(b.name)
          );
          for (const item of rows.slice(0, 20)) {
            console.log("NPM_AUDIT_PACKAGE=" + JSON.stringify(item));
          }
          console.log("NPM_AUDIT_PACKAGES_REPORTED=" + Math.min(rows.length, 20) + "/" + rows.length);
          NODE
      - name: Lint
        run: npm run lint
      - name: Enforce high and critical dependency audit
        run: npm audit --audit-level=high
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Check out the live Socket.IO backend
        uses: actions/checkout@v7
        with:
          repository: peymanpro/socketio-express
          ref: cb836080162c1d6d2ca4c3dd81332ad79bac0f96
          path: socketio-backend
      - name: Install backend dependencies
        run: npm ci --prefix socketio-backend
      - name: Start live Socket.IO backend
        run: |
          PORT=5000 CHAT_ALLOWED_ORIGINS=http://localhost:3000 LNASF_MODE=passive node socketio-backend/server.js > "$RUNNER_TEMP/socketio-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/socketio-backend.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Socket.IO backend is healthy."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/socketio-backend.log"
          exit 1
      - name: Live React-to-Express Socket.IO integration
        env:
          LIVE_SOCKETIO_URL: http://127.0.0.1:5000
          VITE_SOCKET_SERVER_URL: http://127.0.0.1:5000
          VITE_LNASF_MODE: passive
        run: npm run test:integration
